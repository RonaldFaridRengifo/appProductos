services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
      UPLOADS_DIR: /app/uploads
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads
    restart: unless-stopped

volumes:
  sqlite_data:
  uploads_data:
